{% extends "base.html" %}
{% block content %}

<div class="container my-5">
    <div class="row">
        <div class="col-md-6">
            <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}">
        </div>
        <div class="col-md-6">
            <h1>{{ product.name }}</h1>
            <p class="lead">{{ product.description }}</p>

            <div class="mb-3">
                {% if product.is_sale %}
                    <span class="badge bg-danger">Sale</span>
                    <strike class="text-muted fs-4 ms-2">${{ product.price }}</strike>
                    <span class="fs-4 fw-bold ms-2">${{ product.sale_price }}</span>
                {% else %}
                    <span class="fs-4 fw-bold">${{ product.price }}</span>
                {% endif %}
            </div>

            <form id="add-to-cart-form">
                {% csrf_token %}
                <input type="hidden" name="product_id" value="{{ product.id }}">
                <div class="row">
                    <div class="col-md-4">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" name="product_qty" class="form-control" id="quantity" value="1" min="1">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg mt-3">
                    <i class="bi-cart-fill me-1"></i> Add to Cart
                </button>
            </form>
            <div id="add-to-cart-message" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#add-to-cart-form').submit(function(e) {
        e.preventDefault();
        
        var formData = $(this).serialize() + '&action=post';
        
        $.ajax({
            type: 'POST',
            url: '{% url "cart_add" %}',
            data: formData,
            success: function(json) {
                $('#add-to-cart-message').html('<div class="alert alert-success" role="alert">Product added to cart!</div>');
                // You can also update a cart counter in the navbar here
                // For example: $('#cart-count').text(json.qty);
            },
            error: function(xhr, errmsg, err) {
                $('#add-to-cart-message').html('<div class="alert alert-danger" role="alert">An error occurred. Please try again.</div>');
                console.log(xhr.status + ": " + xhr.responseText);
            }
        });
    });
});
</script>

{% endblock %}
